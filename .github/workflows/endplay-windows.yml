name: Endplay Windows compatibility

on:
  push:
    branches: [main, beta]
    paths:
      - ".github/workflows/endplay-windows.yml"
      - "requirements.txt"
      - "endplay_provider/**/*.py"
      - "src/core/dds_wrapper.py"
      - "tests/test_dds_integration.py"
      - "tests/test_endplay_runtime.py"
  pull_request:
    branches: [main, beta]
    paths:
      - ".github/workflows/endplay-windows.yml"
      - "requirements.txt"
      - "endplay_provider/**/*.py"
      - "src/core/dds_wrapper.py"
      - "tests/test_dds_integration.py"
      - "tests/test_endplay_runtime.py"
  workflow_dispatch:

jobs:
  endplay-windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up 64-bit Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64

      - name: Install application requirements and Endplay wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip install --only-binary=endplay -r requirements.txt

      - name: Verify the native Endplay modules import
        run: python -c "from endplay.types import Deal, Player, Denom; from endplay.dds import calc_dd_table, solve_board; print('Endplay DDS ready')"

      - name: Run DDS provider tests
        run: python -m unittest tests.test_endplay_runtime tests.test_dds_integration -v
